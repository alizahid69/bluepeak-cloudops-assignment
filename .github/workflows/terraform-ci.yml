name: Terraform CI

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "modules/**"
      - "live/**"
      - "scripts/**"
      - "terragrunt.hcl"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          TERRAGRUNT_VERSION="0.82.3"
          curl -fsSL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Formatting checks
        run: |
          terraform fmt -check -recursive modules bootstrap
          terragrunt hcl fmt --check

      - name: Validate bootstrap configurations
        shell: bash
        run: |
          set -Eeuo pipefail
          for directory in bootstrap/*; do
            if [[ -d "$directory" && -f "$directory/versions.tf" ]]; then
              terraform -chdir="$directory" init -backend=false
              terraform -chdir="$directory" validate
            fi
          done

      - name: Validate reusable modules
        shell: bash
        run: |
          set -Eeuo pipefail
          for directory in modules/*; do
            if [[ -d "$directory" ]]; then
              terraform -chdir="$directory" init -backend=false
              terraform -chdir="$directory" validate
            fi
          done
